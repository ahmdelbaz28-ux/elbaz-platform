# Selenium IDE CLI Runner Configuration — Local ChromeDriver Mode
# Official docs: https://www.selenium.dev/selenium-ide/docs/en/introduction/command-line-runner
#
# Mode: LOCAL (no Grid) — selenium-side-runner talks to chromedriver directly
# This avoids the Grid 4.x / runner 4.0.13 compatibility bug where the runner
# connects to /session instead of /wd/hub/session after session creation.

# No server URL = local mode (chromedriver started automatically by runner)

# Base URL — the live deployment we're testing
baseUrl: https://ahmedelbaz.qzz.io

# Capabilities — Chrome headless with non-standard binary path
capabilities:
  browserName: chrome
  goog:chromeOptions:
    binary: /home/z/.agent-browser/browsers/chrome-149.0.7827.115/chrome
    args:
      - --headless=new
      - --no-sandbox
      - --disable-dev-shm-usage
      - --disable-gpu
      - --window-size=1920,1080

# Timeout settings (milliseconds)
timeout: 30000
jest-timeout: 120000

# Run tests sequentially
max-workers: 1

# Retry failed tests once
retries: 1
