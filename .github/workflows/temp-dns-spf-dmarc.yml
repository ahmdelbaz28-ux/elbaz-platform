# TEMPORARY operational workflow (owner-delegated, 2026-11-26):
# publish the two missing email deliverability records for ahmedelbaz.qzz.io
#   1. SPF (TXT at apex)   — value taken from Resend's own record set
#                            (v=spf1 include:amazonses.com ~all)
#   2. DMARC (TXT at _dmarc) — Resend's recommended starter policy
#                            (v=DMARC1; p=none;)
# Runs only on manual dispatch. Uses CLOUDFLARE_API_TOKEN without ever
# printing it; logs contain only outcomes and provider error codes.
# DELETE this file after the records are confirmed.
name: temp-dns-spf-dmarc
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Publish SPF + DMARC TXT records
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          H="Authorization: Bearer ${CF_TOKEN}"
          CT="Content-Type: application/json"
          RID=""
          for Z in ahmedelbaz.qzz.io qzz.io; do
            RID=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones?name=$Z" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or [];print(r[0]['id'] if r else '')")
            if [ -n "$RID" ]; then echo "ZONE_RESOLVED name=$Z id=$RID"; break; fi
            echo "ZONE_MISS name=$Z"
          done
          if [ -z "${RID:-}" ]; then echo "RESULT: NO_ZONE_ACCESS"; exit 0; fi
          add() {
            NAME="$1"; VAL="$2"
            EXIST=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones/$RID/dns_records?type=TXT&name=$NAME" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d.get('result') or []))")
            if [ "${EXIST:-0}" != "0" ]; then echo "RESULT: SKIP $NAME (already present: $EXIST)"; return; fi
            curl -s -o /tmp/out.json -X POST -H "$H" -H "$CT" \
              "https://api.cloudflare.com/client/v4/zones/$RID/dns_records" \
              --data "{\"type\":\"TXT\",\"name\":\"$NAME\",\"content\":\"$VAL\",\"ttl\":1}"
            python3 - <<'PY'
import json
d = json.load(open("/tmp/out.json"))
errs = d.get("errors") or []
err = f" err_code={errs[0].get('code')} err_msg={errs[0].get('message')}" if errs else ""
print(f"RESULT: ADD success={d.get('success')}{err}")
PY
          }
          add "ahmedelbaz.qzz.io" "v=spf1 include:amazonses.com ~all"
          add "_dmarc.ahmedelbaz.qzz.io" "v=DMARC1; p=none;"
          echo "DONE"
