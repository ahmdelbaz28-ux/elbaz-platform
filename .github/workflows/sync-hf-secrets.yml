# Sync whitelisted secrets (AI providers, Telegram broadcast bot, Web Push
# VAPID) from GitHub Actions → HF Space.
#
# WHY: the owner's personal HF token is fine-grained and cannot write Space
# secrets (HTTP 404), but the deploy workflow's HF_TOKEN has repo write (it
# pushes commits every deploy). This workflow uses THAT token to copy a
# whitelisted list of keys (AI providers, Telegram broadcast bot) from GitHub
# Actions secrets into the Space's secrets — values never appear in logs
# (GitHub masks both secrets, and the API response carries no echo of the value).
name: Sync AI provider + Telegram secrets to HF Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Push whitelisted provider keys into HF Space secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_API_BASE: ${{ secrets.TELEGRAM_API_BASE }}
          TELEGRAM_API_RELAY_SECRET: ${{ secrets.TELEGRAM_API_RELAY_SECRET }}
          TELEGRAM_BOT_POLLING: ${{ secrets.TELEGRAM_BOT_POLLING }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          EDGE_ORIGIN_SECRET: ${{ secrets.EDGE_ORIGIN_SECRET }}
        run: |
          set -e
          set_secret () {
            NAME="$1"; VALUE="$2"
            if [ -z "$VALUE" ]; then echo "↷ $NAME: not set on GitHub — skipped"; return 0; fi
            CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" \
              -d "{\"key\":\"$NAME\",\"value\":\"$VALUE\"}" \
              "https://huggingface.co/api/spaces/ahmdelbaz28/AHMDRTAP/secrets")
            if [ "$CODE" = "200" ]; then echo "✅ $NAME synced to HF Space (HTTP 200) — Space restarts automatically";
            else echo "❌ $NAME failed (HTTP $CODE): $(head -c 160 /tmp/resp.json)"; exit 1; fi
          }
          set_secret KILOCODE_API_KEY "$KILOCODE_API_KEY"
          set_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          set_secret TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
          set_secret VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          set_secret VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          set_secret NVIDIA_API_KEY "$NVIDIA_API_KEY"
          set_secret OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          set_secret GROQ_API_KEY "$GROQ_API_KEY"
          set_secret TELEGRAM_API_BASE "$TELEGRAM_API_BASE"
          set_secret TELEGRAM_API_RELAY_SECRET "$TELEGRAM_API_RELAY_SECRET"
          set_secret TELEGRAM_BOT_POLLING "$TELEGRAM_BOT_POLLING"
          set_secret RESEND_API_KEY "$RESEND_API_KEY"
          set_secret RESEND_FROM_EMAIL "$RESEND_FROM_EMAIL"
