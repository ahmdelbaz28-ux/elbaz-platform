# ════════════════════════════════════════════════════════════════════════════
# Provider probe — automatic resilience check for the chatbot's AI cascade
# ════════════════════════════════════════════════════════════════════════════
# WHY (Proposal ③): the chatbot cascade silently depended on ONE provider
# (KILOCODE_API_KEY) — if it dies, the chatbot and the thinking lane die with
# it and nobody notices until users complain. This workflow probes every
# CONFIGURED provider key daily with a cheap read-only call (GET /models or
# /auth/key — zero token burn) and, on any failure, alerts the owner on the
# Telegram channel (@engahmedetap) via the same broadcast bot.
#
# MISSING (unset) keys are reported as gaps — never failures — so adding
# NVIDIA/GROQ/OPENROUTER keys to the repo secrets later "just works": the next
# probe validates them automatically. The sync-hf-secrets workflow already
# whitelists all four keys for the HF Space.
#
# LAYER 2 (authoritative): the Space's OWN env is probed live via the gated
# GET /api/health/providers endpoint (EDGE_ORIGIN_SECRET bearer + forwarded
# host headers) — the keys live on the Space, GitHub only holds mirrors, so
# this layer catches a dead HF-side key even when its GH mirror is fine.
# ════════════════════════════════════════════════════════════════════════════
name: Provider probe

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC — before the platform's busy hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The probe is dependency-free (plain fetch) — no npm ci needed.
      # OWNER POLICY: nothing is posted to Telegram — a failing probe turns
      # the run red on GitHub, that's the entire alert path.
      - name: Probe all configured AI providers
        env:
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SPACE_PROBE_URL: https://ahmdelbaz28-ahmdrtap.hf.space
          EDGE_ORIGIN_SECRET: ${{ secrets.EDGE_ORIGIN_SECRET }}
        run: |
          set -x
          npx -y tsx scripts/provider-probe.ts 2>&1 | tee /tmp/probe.log
          CODE=${PIPESTATUS[0]}
          echo "probe exit code: $CODE"
          exit "$CODE"

      - name: Append probe table to the run summary
        if: always()
        run: tail -n 45 /tmp/probe.log >> "$GITHUB_STEP_SUMMARY" || true
