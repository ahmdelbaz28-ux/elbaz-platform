# 🗄️ Daily database backup — pulls a full SQL dump from the platform's
# operator-gated endpoint and stores it as a DRAFT GitHub Release asset.
#
# How it works:
#   1. GET /api/maintenance/backup with Authorization: Bearer BACKUP_TOKEN
#      (the app reads DATABASE_URL from its own env — credentials never
#      travel to GitHub; this repo only ever sees the finished dump).
#   2. Integrity gate: HTTP 200 + size sanity + gzip validity + a real
#      "CREATE TABLE" in the head of the stream — a broken dump fails loudly.
#   3. Stored as a DATED DRAFT release `db-backup-YYYYMMDD`, auto-pruned to
#      the newest 7 (one week of rollback points).
#      ⚠️ DRAFT, not published (security fix 2026-11-11): this repo is PUBLIC
#      and published release assets are world-downloadable — two dumps WERE
#      publicly downloadable before the fix (anonymous 200 confirmed). Draft
#      assets require push access to fetch. The "anon-download must 404"
#      self-check below turns any future regression into a red run.
#   4. Telegram alert on failure AND a short confirmation on success.
#
# Restore (owner, authenticated):
#   gh release download db-backup-YYYYMMDD -R ahmdelbaz28-ux/elbaz-platform -p "*.sql.gz" \
#     && gunzip -c elbaz-db-*.sql.gz | mysql -h <host> -u <user> -p <dbname>

name: Daily DB Backup

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 03:30 Cairo — before the day starts
  workflow_dispatch: {} # manual run for tests/restore drills

permissions:
  contents: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull SQL dump from platform
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          # Direct-to-origin (hf.space): the custom domain sits behind
          # Cloudflare, which 403-challenges GitHub runner datacenter IPs —
          # live-probed 2026-11-10. Two shields must be threaded:
          #   1. shield.ts EDGE_HOST_ENFORCE rejects direct hf.space requests —
          #      EXCEPT sec-fetch-dest: iframe (documented embed exception).
          #   2. Cloudflare never sees this call at all (HF edge, not CF zone).
          BACKUP_URL: https://ahmdelbaz28-ahmdrtap.hf.space/api/maintenance/dump
          UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          OUT="elbaz-db-${STAMP}.sql.gz"
          CODE=$(curl -sS --max-time 120 -w '%{http_code}' -o "$OUT" \
            -A "$UA" -H "sec-fetch-dest: iframe" \
            -H "Authorization: Bearer ${BACKUP_TOKEN}" "$BACKUP_URL")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::backup endpoint returned HTTP $CODE"; exit 1; }
          SIZE=$(stat -c%s "$OUT")
          echo "dump size: ${SIZE} bytes"
          [ "$SIZE" -gt 500 ] || { echo "::error::dump suspiciously small (${SIZE}B)"; exit 1; }
          gunzip -c "$OUT" > /tmp/dump.sql
          grep -q "CREATE TABLE" /tmp/dump.sql \
            || { echo "::error::no CREATE TABLE in dump"; exit 1; }
          rm -f /tmp/dump.sql
          TABLES=$(curl -sS -A "$UA" -H "sec-fetch-dest: iframe" \
            -H "Authorization: Bearer ${BACKUP_TOKEN}" \
            "${BACKUP_URL}/manifest" | grep -o '"name"' | wc -l || true)
          echo "tables in manifest: ${TABLES:-?}"
          echo "dump_file=${OUT}" >> "$GITHUB_ENV"

      - name: Store as draft release (keep last 7 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="db-backup-$(date -u +%Y%m%d)"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # --draft is the security boundary (repo is PUBLIC): draft assets are
          # fetchable only with push access. NEVER remove this flag.
          gh release create "$TAG" "${{ env.dump_file }}" -R "$GITHUB_REPOSITORY" --draft \
            --title "DB backup $(date -u '+%Y-%m-%d %H:%M') UTC" \
            --notes "Automated daily backup (DRAFT — private rollback point, auto-pruned after 7). Restore: see workflow header."
          TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate -q '.[].tag_name' | grep '^db-backup-' || true)
          echo "$TAGS" | sort | head -n -7 | while read -r OLD; do
            [ -n "$OLD" ] && gh release delete "$OLD" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

      # Self-verifying regression gate for the 2026-11-11 leak: the fresh
      # asset MUST NOT be anonymously downloadable. A 200 here means the dump
      # is world-readable — fail the run loudly (and the Telegram alert fires).
      - name: Verify asset is NOT anonymously downloadable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="db-backup-$(date -u +%Y%m%d)"
          # Draft releases are NOT resolvable via /releases/tags/{tag} (that
          # endpoint ignores drafts) — resolve from the releases LIST instead.
          # NOTE: gh api has no --arg flag (jq-only) — the tag is spliced into
          # the template; TAG is server-generated (db-backup-YYYYMMDD), safe.
          ASSET_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            -q '.[] | select(.tag_name == "'"${TAG}"'") | .assets[0].browser_download_url')
          echo "asset: $ASSET_URL"
          CODE=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 "$ASSET_URL")
          echo "anonymous download probe: HTTP $CODE"
          [ "$CODE" != "200" ] || {
            echo "::error::SECURITY: backup asset is anonymously downloadable (HTTP 200) — the repo must be private, the release a draft, or the asset removed"
            exit 1
          }
          echo "✅ asset not publicly reachable (HTTP $CODE)"

      - name: Telegram alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s --max-time 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🚨 فشل النسخ الاحتياطي لقاعدة البيانات! راجع: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null 2>&1 || true

      - name: Telegram confirmation on success
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SIZE_MB=$(du -m "${{ env.dump_file }}" | cut -f1)
          curl -s --max-time 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="✅ تم النسخ الاحتياطي اليومي لقاعدة البيانات (${SIZE_MB} MB) — متاح في Releases" \
            >/dev/null 2>&1 || true
