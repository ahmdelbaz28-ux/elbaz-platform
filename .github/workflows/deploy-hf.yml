# Deploy to HuggingFace Spaces on push to main
# Uses git push with LFS to handle binary files
name: Deploy to HF Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions: this workflow only needs to read repo contents
# and push to HF (which uses HF_TOKEN, not GITHUB_TOKEN). Setting explicit
# permissions prevents the default `write` token from being leaked/abused.
permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════
  # GATE: Run tests BEFORE deploying — prevent broken code from reaching production
  # 84 unit tests covering: JWT, Password, RateLimiter, Cache, Chatbot
  # CRITICAL: If tests fail, deployment MUST be blocked. No continue-on-error.
  # ══════════════════════════════════════════════════════════
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update lockfile (if needed)
        run: |
          if ! npm ci --dry-run 2>/dev/null; then
            npm install --package-lock-only --no-audit --no-fund
          fi

      - name: Run unit tests with coverage
        env:
          NODE_ENV: test
          APP_SECRET: test-secret-not-for-production-minimum-32-chars
          OPENROUTER_API_KEY: sk-or-v1-test-key-for-ci-only
          DATABASE_URL: mysql2://test:test@localhost:3306/test
        run: npx vitest run --coverage --reporter=verbose

      - name: Build frontend (verify no compilation errors)
        run: npm run build -- --logLevel error

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # NOTE: SonarCloud analysis runs via the SonarCloud GitHub App
      # (installed at org level), not via a workflow step. The App
      # automatically analyzes on every push. Coverage is NOT sent to
      # SonarCloud because that requires a SONAR_TOKEN secret + the
      # sonarcloud-github-action step — but that would conflict with
      # the App's automatic analysis. To enable coverage reporting on
      # SonarCloud dashboard, the repo owner must either:
      #   1. Disable the App and use the action with SONAR_TOKEN, OR
      #   2. Keep the App and accept 0% coverage display (current state)
      # The LCOV report is still generated and uploaded as an artifact
      # for local inspection via `npm run test:coverage`.

  # ══════════════════════════════════════════════════════════
  # DEPLOY: Only runs if tests pass (needs: test = hard gate)
  # If ANY test fails, this job will NOT run — broken code stays out
  # ══════════════════════════════════════════════════════════
  deploy:
    needs: test
    if: success()    # Extra safety: only deploy if test job succeeded
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true    # ✅ Fetch LFS objects so we can push them to HF

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs fetch --all origin
          git lfs checkout
          echo "=== LFS files tracked ==="
          git lfs ls-files | head -10
          echo "..."
          echo "Total LFS files: $(git lfs ls-files | wc -l)"

      - name: Verify LFS objects are present (not just pointers)
        run: |
          # Pick a known image file and check it's a real binary, not a pointer
          if [ -f public/logo.png ]; then
            size=$(wc -c < public/logo.png)
            if [ "$size" -lt 200 ]; then
              echo "❌ FATAL: public/logo.png is still an LFS pointer ($size bytes)"
              echo "LFS fetch did not work. Aborting deploy."
              exit 1
            else
              echo "✅ public/logo.png is a real binary ($size bytes)"
            fi
          fi

      - name: Configure Git for HF
        # ✅ SECURITY (SonarCloud S7636): Never expand `secrets.*` directly
        # inside a `run:` block — any later step that prints `$GITHUB_ENV`
        # or the workflow log could leak the secret. Pass it via the `env:`
        # block so GitHub can mask it automatically in logs.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Quote the URL so the token is not visible in `git remote -v` output
          # in CI logs (git redacts user:password@ in `remote -v` already, but
          # we set the URL with `git config` redaction enabled as belt-and-braces).
          git config --global credential.helper '!f() { echo "username=ahmdelbaz28"; echo "password=${HF_TOKEN}"; }; f'
          git remote add hf-space https://huggingface.co/spaces/ahmdelbaz28/AHMDRTAP.git
          git config user.email "ahmdelbaz28@users.noreply.github.com"
          git config user.name "ahmdelbaz28-ux"

      - name: Push to HF Spaces (commits + LFS objects)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # Push commit history first
          git push hf-space main --force
          # Push LFS objects to HF's Xet storage
          git lfs push hf-space --all
          echo "Deploy complete! SHA: ${SHA}"

      - name: Deployment Status
        if: always()
        run: echo "Deployment completed. Check https://huggingface.co/spaces/ahmdelbaz28/AHMDRTAP for build status."
