# ════════════════════════════════════════════════════════════════════════════
# Deploy Cloudflare Worker via direct API (bypasses broken Workers Builds)
# ════════════════════════════════════════════════════════════════════════════
# WHY THIS EXISTS:
#   The Workers Build in the Cloudflare dashboard keeps failing at the
#   "Deploying" step because `npx wrangler versions upload` needs a
#   wrangler.toml in the repo. This workflow uses the Cloudflare REST API
#   directly, which is more reliable than wrangler and gives full control.
#
# HOW IT WORKS:
#   Uses PUT /accounts/{account_id}/workers/scripts/{script_name} with
#   multipart form data (metadata + worker.js module).
#
# HOW TO USE:
#   1. GitHub Secrets `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID`
#      are already configured in this repo.
#   2. Push to main. The Worker will deploy automatically when the
#      Worker source code or wrangler.toml changes.
#   3. You can also trigger this workflow manually via the Actions tab.
#
# DISABLE THE BROKEN WORKERS BUILD:
#   Workers & Pages → ahmedelbaz → Settings → Build → Remove
#   (Once removed, this workflow is the only deploy path.)
# ════════════════════════════════════════════════════════════════════════════
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'infra/security-audit/worker-v7-hardened.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cf-worker.yml'
  workflow_dispatch:

# Least-privilege: only needs to read repo contents. Worker deploy uses
# CLOUDFLARE_API_TOKEN (a repo secret), not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy Worker via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ahmedelbaz
          WORKER_FILE: infra/security-audit/worker-v7-hardened.js
          EDGE_ORIGIN_SECRET: ${{ secrets.EDGE_ORIGIN_SECRET }}
          TG_RELAY_SECRET: ${{ secrets.TG_RELAY_SECRET }}
          SYNC_INGEST_SECRET: ${{ secrets.SYNC_INGEST_SECRET }}
        run: |
          set -euo pipefail
          echo "=== Deploying Worker '${WORKER_NAME}' to account ${CLOUDFLARE_ACCOUNT_ID} ==="

          # Build the multipart payload manually to ensure compatibility
          # with Cloudflare's Workers API (ES module format).
          python3 << 'PYEOF'
          import os
          import json
          import requests

          token = os.environ['CLOUDFLARE_API_TOKEN']
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          worker_name = os.environ['WORKER_NAME']
          worker_file = os.environ['WORKER_FILE']

          with open(worker_file, 'r') as f:
              worker_code = f.read()

          metadata = {
              "main_module": "worker.js",
              "compatibility_date": "2025-09-23",
              "compatibility_flags": []
          }

          # ✅ SECURITY (post-audit): provision the edge→origin HMAC secret as a
          # binding so every proxied request carries x-edge-ts/x-edge-sig and the
          # origin's shield middleware rejects direct-to-origin traffic. Fail
          # LOUDLY when missing — deploying without it silently re-opens the
          # direct-to-origin bypass door.
          edge_secret = os.environ.get('EDGE_ORIGIN_SECRET', '').strip()
          if not edge_secret or len(edge_secret) < 32:
              print("  ❌ EDGE_ORIGIN_SECRET missing or shorter than 32 chars — refusing to deploy an unprotected edge")
              exit(1)
          metadata['bindings'] = [
              {"name": "EDGE_ORIGIN_SECRET", "type": "secret_text", "text": edge_secret}
          ]
          print("  → EDGE_ORIGIN_SECRET binding present (value hidden)")

          # Telegram transport relay (root-cure of the 2026-10-29 egress block):
          # /tg/* forwards Bot API calls from the origin to api.telegram.org.
          # Fail LOUDLY when missing — deploying without it leaves the relay
          # unauthenticated-by-absence (503) and the Space cut off from Telegram.
          tg_secret = os.environ.get('TG_RELAY_SECRET', '').strip()
          if not tg_secret or len(tg_secret) < 32:
              print("  ❌ TG_RELAY_SECRET missing or shorter than 32 chars — refusing to deploy (telegram relay unguarded)")
              exit(1)
          metadata['bindings'].append(
              {"name": "TG_RELAY_SECRET", "type": "secret_text", "text": tg_secret}
          )
          print("  → TG_RELAY_SECRET binding present (value hidden)")

          # Worker cron sync push (2026-11-10): the scheduled handler posts the
          # playlist to the origin's HMAC-gated ingest — the DETERMINISTIC
          # mirror driver (GitHub Actions' scheduler skips/delays runs; the
          # origin's YouTube egress is blocked). Optional on purpose: missing
          # secret = dormant push, the deploy itself must not fail.
          ingest_secret = os.environ.get('SYNC_INGEST_SECRET', '').strip()
          if ingest_secret and len(ingest_secret) >= 16:
              metadata['bindings'].append(
                  {"name": "SYNC_INGEST_SECRET", "type": "secret_text", "text": ingest_secret}
              )
              print("  → SYNC_INGEST_SECRET binding present (worker cron sync push active)")
          else:
              print("  ⚠️ SYNC_INGEST_SECRET missing — worker cron sync push stays dormant")

          files = {
              'metadata': (None, json.dumps(metadata), 'application/json'),
              'worker.js': ('worker.js', worker_code, 'application/javascript+module'),
          }

          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{worker_name}"
          headers = {"Authorization": f"Bearer {token}"}

          print(f"  → Uploading {len(worker_code)} bytes to {url}")
          resp = requests.put(url, headers=headers, files=files)
          print(f"  HTTP Status: {resp.status_code}")

          data = resp.json()
          if data.get('success'):
              result = data.get('result', {})
              print(f"  ✅ Worker deployed!")
              print(f"  • Modified: {result.get('modified_on','?')}")
              print(f"  • Deployment ID: {result.get('deployment_id','?')}")
              print(f"  • Compatibility date: {result.get('compatibility_date','?')}")
          else:
              print(f"  ❌ Deploy failed:")
              print(json.dumps(data, indent=2))
              exit(1)
          PYEOF

      - name: Register cron schedule for the sync push
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ahmedelbaz
          SYNC_INGEST_SECRET: ${{ secrets.SYNC_INGEST_SECRET }}
        run: |
          set -euo pipefail
          # Off-boundary minutes (13,28,43,58) — offset from the GH relay's
          # 7,22,37,52 so the two drivers never stack on the same minute.
          if [ -z "${SYNC_INGEST_SECRET:-}" ]; then
            echo "  ⚠️ SYNC_INGEST_SECRET unset — cron schedule not registered (push stays dormant)"
            exit 0
          fi
          REG() {
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$1"
          }
          RES=$(REG '[{"cron":"13,28,43,58 * * * *"}]')
          if ! echo "$RES" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('success') else 1)" 2>/dev/null; then
            echo "  array form rejected — retrying with wrapped schedules form"
            RES=$(REG '{"schedules":[{"cron":"13,28,43,58 * * * *"}]}')
          fi
          echo "$RES" | python3 -c "import json,sys; d=json.load(sys.stdin); print('  ✅ cron schedules registered:', json.dumps(d.get('result', {}))[:200]) if d.get('success') else (print('  ❌ schedules registration failed:', json.dumps(d)[:300]), sys.exit(1))"

      - name: Check custom domain -> worker route (warning-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ahmedelbaz
          DOMAIN: ahmedelbaz.qzz.io
        run: |
          set -euo pipefail
          # POST-AUDIT FINDING (measured): qzz.io is NOT a zone on this CF
          # account (GET /zones returns []) — the domain is an external DNS
          # record pointing at *.hf.space, and the "cloudflare" in its response
          # headers is HF's own edge. The worker therefore never served domain
          # traffic, and a workers route CANNOT be created without the zone.
          # This step documents the gap loudly; it does not fail the deploy.
          # To truly route the domain through the worker: add qzz.io as a zone
          # on the CF account (or move DNS), then create a route manually or
          # restore the binding step.
          python3 << 'PYEOF'
          import os, json, requests
          token = os.environ['CLOUDFLARE_API_TOKEN']
          H = {"Authorization": f"Bearer {token}"}
          zr = requests.get("https://api.cloudflare.com/client/v4/zones?name=qzz.io", headers=H).json()
          zones = zr.get('result') or []
          if not zr.get('success') or not zones:
              print("  ⚠️ qzz.io is NOT a zone on this CF account — worker route CANNOT exist for it.")
              print("  ⚠️ Edge worker stages (WAF/signing) are NOT in the domain's request path.")
              print("  ⚠️ Origin-side host allowlist (EDGE_HOST_ENFORCE) is the active edge control.")
          else:
              zone_id = zones[0]['id']
              rr = requests.get(f"https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes", headers=H).json()
              if rr.get('success'):
                  print("  Current workers routes:", json.dumps(rr['result'], indent=2)[:500])
          PYEOF

      - name: Verify deployment
        env:
          WORKER_NAME: ahmedelbaz
          TG_RELAY_SECRET: ${{ secrets.TG_RELAY_SECRET }}
        run: |
          sleep 5
          # Test worker.dev endpoint (Worker v7 blocks empty UAs)
          WORKER_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            https://${WORKER_NAME}.ahmdelbaz28.workers.dev)
          echo "Worker.dev returned HTTP $WORKER_STATUS"

          # Test custom domain
          DOMAIN_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            https://ahmedelbaz.qzz.io)
          echo "Custom domain returned HTTP $DOMAIN_STATUS"

          # ── YouTube data relay live check (/yt/*) ──
          # Derive the EXACT token the Space derives from TELEGRAM_API_RELAY_
          # SECRET (hex(HMAC-SHA256(secret, "yt-relay-v1"))) and expect a real
          # 200 ok:true answer — proves auth, YouTube egress and parsing on
          # the live edge in one shot. Unauthenticated calls must stay a
          # stealth 404 (never an open YouTube proxy).
          # If the workers.dev hostname answers with a Cloudflare Access login
          # redirect, the relay code is UNREACHABLE (account-level Zero Trust
          # wall) — report the exact dashboard fix and skip the live
          # assertions instead of failing every future deploy red.
          YT_TOKEN=$(TG_RELAY_SECRET="$TG_RELAY_SECRET" python3 -c 'import os,hmac,hashlib; s=os.environ.get("TG_RELAY_SECRET","").strip(); print(hmac.new(s.encode(), b"yt-relay-v1", hashlib.sha256).hexdigest() if len(s)>=16 else "")')
          if [ -n "$YT_TOKEN" ]; then
            UA='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
            STEALTH_OUT=$(curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" -H "$UA" \
              "https://${WORKER_NAME}.ahmdelbaz28.workers.dev/yt/playlist?list=PLeeb5_Qjhcgc")
            STEALTH=$(echo "$STEALTH_OUT" | cut -d' ' -f1)
            STEALTH_LOC=$(echo "$STEALTH_OUT" | cut -d' ' -f2-)
            echo "Relay without token: HTTP $STEALTH"
            case "$STEALTH_LOC" in
              *cloudflareaccess.com*)
                echo "⚠️  workers.dev is behind a Cloudflare Access LOGIN WALL — the /yt (and /tg)"
                echo "    relays are unreachable for server-to-server callers until bypassed."
                echo "    FIX (2 min): Cloudflare Dashboard → Zero Trust → Access → Applications →"
                echo "    the app covering ahmedelbaz.ahmdelbaz28.workers.dev → add a Bypass policy"
                echo "    for paths /yt* and /tg* (the worker's own secret gates already auth them)."
                echo "    The worker script itself deployed fine — skipping live relay assertions."
                exit 0
                ;;
            esac
            if [ "$STEALTH" != "404" ]; then
              echo "❌ Relay gate broken: unauthenticated /yt/playlist returned $STEALTH (expected stealth 404)"
              exit 1
            fi
            YT_CODE=$(curl -sS -o /tmp/yt.json -w "%{http_code}" -H "$UA" \
              -H "X-Yt-Relay-Token: $YT_TOKEN" \
              "https://${WORKER_NAME}.ahmdelbaz28.workers.dev/yt/playlist?list=PLeeb5_Qjhcgc")
            echo "Relay with derived token: HTTP $YT_CODE"
            if [ "$YT_CODE" != "200" ] || ! python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/yt.json')).get('ok') is True else 1)"; then
              echo "❌ YouTube data relay verification failed:"
              head -c 300 /tmp/yt.json 2>/dev/null; echo
              exit 1
            fi
            ITEMS=$(python3 -c "import json; print(len(json.load(open('/tmp/yt.json')).get('items', [])))")
            if [ "$ITEMS" -gt 0 ]; then
              echo "✅ YouTube data relay verified live — ok:true, $ITEMS playlist items with verbatim titles"
            else
              echo "⚠️ Relay answered ok:true but 0 items — verify the playlist id still exists on YouTube"
            fi
          else
            echo "⚠️ TG_RELAY_SECRET unavailable in this step — /yt live check skipped"
          fi

          if [ "$WORKER_STATUS" = "200" ] || [ "$WORKER_STATUS" = "302" ] || [ "$WORKER_STATUS" = "404" ]; then
            echo "✅ Worker is responding correctly"
          else
            echo "⚠️ Worker returned unexpected status ($WORKER_STATUS)"
            exit 1
          fi

      - name: Sync relay secret to HF Space (TELEGRAM_API_RELAY_SECRET)
        # The Space-side YouTube relay client derives its route token from
        # TELEGRAM_API_RELAY_SECRET (same value as the worker's TG_RELAY_SECRET
        # binding — one secret, two names, proven contract). Sync it here so
        # the relay activates WITHOUT a manual sync-hf-secrets dispatch.
        # Note: this does NOT flip the Telegram transport — TELEGRAM_API_BASE
        # stays unset on the Space (transport=direct is the working state).
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TG_RELAY_SECRET: ${{ secrets.TG_RELAY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then echo "↷ HF_TOKEN not set — skipped (run sync-hf-secrets manually)"; exit 0; fi
          CODE=$(curl -sS -o /tmp/hfsec.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $HF_TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\":\"TELEGRAM_API_RELAY_SECRET\",\"value\":\"$TG_RELAY_SECRET\"}" \
            "https://huggingface.co/api/spaces/ahmdelbaz28/AHMDRTAP/secrets")
          if [ "$CODE" = "200" ]; then
            echo "✅ TELEGRAM_API_RELAY_SECRET synced to the Space — YouTube relay token source ready (Space restarts automatically)"
          else
            echo "⚠️ Space secret sync failed (HTTP $CODE) — the YouTube relay stays dormant until sync-hf-secrets runs"
            head -c 200 /tmp/hfsec.json; echo
          fi
