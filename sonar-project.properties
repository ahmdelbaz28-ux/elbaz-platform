# ═══════════════════════════════════════════════════════════
# SonarCloud Configuration — elbaz-platform
# ═══════════════════════════════════════════════════════════
# Learn more: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/
#
# First-time setup:
#   1. Go to https://sonarcloud.io/projects/create
#   2. Import the GitHub repository: ahmdelbaz28-ux/elbaz-platform
#   3. Add SONAR_TOKEN to GitHub Secrets (Settings → Secrets and variables → Actions)
#   4. Push this file + the workflow — analysis runs automatically on push/PR

sonar.projectKey=ahmdelbaz28-ux_elbaz-platform
sonar.organization=ahmdelbaz28-ux

# ── Repository ──
sonar.links.homepage=https://ahmedelbaz.qzz.io
sonar.links.scm=https://github.com/ahmdelbaz28-ux/elbaz-platform

# ── Sources ──
sonar.sources=api,src,contracts,db
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/__tests__/**,\
  **/tests/**,\
  **/android/**,\
  **/ios/**,\
  **/electron/**,\
  **/infra/**,\
  **/scripts/**,\
  **/public/**,\
  **/cache/**,\
  **/*.config.*,\
  **/vite-env.d.ts

# ── Tests ──
sonar.tests=api,src
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# ── Coverage (Vitest generates lcov.info) ──
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── TypeScript ──
sonar.typescript.tsconfigPath=tsconfig.json

# ── ESLint integration ──
sonar.eslint.reportPaths=eslint-report.json

# ── Language ──
sonar.language=ts

# ── Source encoding ──
sonar.sourceEncoding=UTF-8

# ── Quality gate ──
sonar.qualitygate.wait=false

# ── Pull Request decoration ──
sonar.pullrequest.provider=github
