# SonarCloud configuration — shared by Automatic Analysis and the CI workflow.
#
# WHY THIS FILE EXISTS: the workflow scan (SonarCloud Analysis check) already
# scopes sources to the shipped application. Without this file, SonarCloud's
# AUTOMATIC analysis ("SonarCloud Code Analysis" check) scans the ENTIRE repo
# — including operator-only diagnostic tooling under scripts/, static public
# assets and infra manifests — and those pre-existing operator-script findings
# dragged the Security/Ratings on New Code below the quality-gate thresholds.
# This file gives both analyzers the SAME, application-scoped view.
sonar.projectKey=ahmdelbaz28-ux_elbaz-platform
sonar.organization=ahmdelbaz28-ux

# Analyze only the shipped application (mirrors the CI workflow's scope).
sonar.sources=api,src,contracts,db

# Test coverage + lint reports (same paths the workflow uploads).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=eslint-report.json

# Belt-and-braces exclusions (mirrors the workflow flags).
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/tests/**,**/android/**,**/ios/**,**/electron/**,**/infra/**,**/scripts/**,**/public/**,**/cache/**,**/*.config.*,**/vite-env.d.ts

# Test-file detection for coverage accounting.
sonar.tests=api,src,contracts,db
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# JavaScript/TypeScript language version.
sonar.javascript.maxFileSize=2000
