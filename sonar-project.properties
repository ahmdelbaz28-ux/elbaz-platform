# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud Configuration — elbaz-platform
# ─────────────────────────────────────────────────────────────────────────────
# This file configures SonarCloud analysis settings.
# See: https://docs.sonarsource.com/sonarqube/latest/project-administration/analysis-scope/

# Organization & project key (matched to SonarCloud dashboard)
sonar.organization=ahmdelbaz28-ux
sonar.projectKey=ahmdelbaz28-ux_elbaz-platform
sonar.projectName=elbaz-platform

# Source paths
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.git/**,**/android/**,**/electron/**,**/infra/**,**/scripts/**,**/cache/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.spec.ts

# ─── Issue Exclusions ───────────────────────────────────────────────────────
# S6819 (Accessibility): shadcn/ui library components intentionally use ARIA
# roles (role="group", role="list", role="dialog", role="link",
# role="presentation") on native elements to provide correct semantics for
# composite widgets. Converting to native elements would break the shadcn/ui
# component API. These are false positives for library code.
sonar.issue.ignore.multicriteria=S6819ui
sonar.issue.ignore.multicriteria.S6819ui.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.S6819ui.resourceKey=src/components/ui/**/*.tsx

# S6819 for Navbar and NotificationCenter dialog/list roles (app-level composite widgets)
sonar.issue.ignore.multicriteria.S6819nav
sonar.issue.ignore.multicriteria.S6819nav.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.S6819nav.resourceKey=src/components/Navbar.tsx
sonar.issue.ignore.multicriteria.S6819nc
sonar.issue.ignore.multicriteria.S6819nc.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.S6819nc.resourceKey=src/components/NotificationCenter.tsx

# ─── Coverage Exclusions ────────────────────────────────────────────────────
# These paths contain infrastructure/config code that doesn't need test coverage
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/*.config.ts,**/*.config.js,**/infra/**,**/scripts/**,**/db/**,**/android/**,**/electron/**

# ─── Test Coverage Reports ──────────────────────────────────────────────────
# Vitest generates LCOV reports at coverage/lcov.info when running `npm run test:coverage`.
# SonarCloud reads this file to compute code coverage on the dashboard.
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ─── Test Files ──────────────────────────────────────────────────────────────
# Mark test files so SonarCloud doesn't count them as production code
sonar.tests=api
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
